name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    
    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Get short SHA for tagging
    - name: Get short SHA
      id: sha
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        version: latest
        buildkitd-flags: --debug

    # Login to Custom Registry
    - name: Login to Custom Registry
      uses: docker/login-action@v2
      with:
        registry: registry.starkleytech.com
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        logout: true

    # Build and push Docker image
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          registry.starkleytech.com/hippius/docs:${{ steps.sha.outputs.SHORT_SHA }}
          registry.starkleytech.com/hippius/docs:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        provenance: false
        sbom: false
        outputs: type=registry,compression=gzip,compression-level=3,force-compression=true

    # Set up kubectl
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      
    # Deploy to Kubernetes
    - name: Kubernetes credentials (OpenBao kube-broker, 15 min)
      uses: ./.github/actions/kube-login
      with:
        scope: hippius-doc

    - name: Deploy to Rancher K8s
      run: |
        
        # Create namespace if it doesn't exist
        kubectl create namespace hippius-documentation || true
        
        # Update deployment file with the current image tag
        sed -i "s|\${IMAGE}|registry.starkleytech.com/hippius/docs:${{ steps.sha.outputs.SHORT_SHA }}|g" k8s/deployment.yaml
        
        # Apply the deployment with validation disabled
        kubectl apply -f k8s/deployment.yaml --validate=false
        
        # Wait for rollout with increased timeout
        kubectl rollout status deployment/hippius-docs -n hippius-documentation --timeout=180s
        
        # Print deployment status for debugging
        echo "Deployment status:"
        kubectl get deployments -n hippius-documentation
        
        # Print pod status
        echo "Pod status:"
        kubectl get pods -n hippius-documentation 